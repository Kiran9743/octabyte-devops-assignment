name: Build, Scan and Deploy

on:
  push:
    branches: [master]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1

jobs:
  build-scan-push:
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.image.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/${{ secrets.ECR_REPOSITORY }}:${GITHUB_SHA}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "Building image: $IMAGE"

      - name: Build image
        run: |
          docker build \
            -t "${{ steps.image.outputs.image }}" \
            ./app

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.image.outputs.image }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Push image
        run: |
          docker push "${{ steps.image.outputs.image }}"

  deploy-staging:
    needs: build-scan-push
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to staging EC2 instances
        env:
          IMAGE: ${{ needs.build-scan-push.outputs.image }}
          INSTANCE_IDS: ${{ secrets.STAGING_INSTANCE_IDS }}
        run: |
          set -euo pipefail

          echo "Deploying image:"
          echo "$IMAGE"

          for INSTANCE_ID in $INSTANCE_IDS; do
            echo "Deploying to $INSTANCE_ID"

            COMMAND_ID=$(aws ssm send-command \
              --region "$AWS_REGION" \
              --instance-ids "$INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --parameters commands="[\
              \"set -e\",\
              \"aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $(echo $IMAGE | cut -d/ -f1)\",\
              \"docker pull $IMAGE\",\
              \"docker rm -f octabyte-app || true\",\
              \"docker run -d --name octabyte-app --restart unless-stopped -p 8000:8000 $IMAGE\",\
              \"sleep 5\",\
              \"curl -f http://127.0.0.1:8000/health\"\
              ]" \
              --query "Command.CommandId" \
              --output text)

            echo "SSM command: $COMMAND_ID"

            aws ssm wait command-executed \
              --region "$AWS_REGION" \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID"

            STATUS=$(aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text)

            echo "$INSTANCE_ID deployment status: $STATUS"

            if [ "$STATUS" != "Success" ]; then
              aws ssm get-command-invocation \
                --region "$AWS_REGION" \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID"

              exit 1
            fi
          done

  integration-test:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get staging ALB DNS
        id: alb
        run: |
          ALB_DNS=$(aws elbv2 describe-load-balancers \
            --region "$AWS_REGION" \
            --query "LoadBalancers[?LoadBalancerName=='octabyte-devops-staging'].DNSName" \
            --output text)

          if [ -z "$ALB_DNS" ] || [ "$ALB_DNS" = "None" ]; then
            echo "Staging ALB not found"
            exit 1
          fi

          echo "ALB DNS: $ALB_DNS"
          echo "dns=$ALB_DNS" >> "$GITHUB_OUTPUT"

      - name: Health check
        run: |
          set -e

          URL="http://${{ steps.alb.outputs.dns }}/health"

          echo "Testing $URL"

          for i in {1..10}; do
            if curl --fail --silent --show-error "$URL"; then
              echo
              echo "Staging health check passed."
              exit 0
            fi

            echo "Health check attempt $i failed. Retrying..."
            sleep 5
          done

          echo "Staging health check failed."
          exit 1

      - name: Application endpoint test
        run: |
          set -e

          URL="http://${{ steps.alb.outputs.dns }}/"

          echo "Testing $URL"

          curl --fail --silent --show-error "$URL"
          echo
          echo "Application endpoint test passed."

  deploy-production:
    needs: integration-test
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy production EC2 instances
        env:
          IMAGE: ${{ needs.build-scan-push.outputs.image }}
          INSTANCE_IDS: ${{ secrets.PRODUCTION_INSTANCE_IDS }}
        run: |
          set -euo pipefail

          if [ -z "$INSTANCE_IDS" ]; then
            echo "PRODUCTION_INSTANCE_IDS is not configured."
            exit 1
          fi

          for INSTANCE_ID in $INSTANCE_IDS; do
            echo "Deploying $IMAGE to production instance $INSTANCE_ID"

            COMMAND_ID=$(aws ssm send-command \
              --region "$AWS_REGION" \
              --instance-ids "$INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --parameters commands="[\
              \"set -e\",\
              \"aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $(echo $IMAGE | cut -d/ -f1)\",\
              \"docker pull $IMAGE\",\
              \"docker rm -f octabyte-app || true\",\
              \"docker run -d --name octabyte-app --restart unless-stopped -p 8000:8000 $IMAGE\",\
              \"sleep 5\",\
              \"curl -f http://127.0.0.1:8000/health\"\
              ]" \
              --query "Command.CommandId" \
              --output text)

            echo "SSM command: $COMMAND_ID"

            aws ssm wait command-executed \
              --region "$AWS_REGION" \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID"

            STATUS=$(aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text)

            if [ "$STATUS" != "Success" ]; then
              aws ssm get-command-invocation \
                --region "$AWS_REGION" \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID"

              exit 1
            fi
          done

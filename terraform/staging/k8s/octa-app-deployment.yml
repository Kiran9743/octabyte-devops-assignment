apiVersion: apps/v1
kind: Deployment
metadata:
  name: octa-app
  namespace: staging
  labels:
    app: octa-app
    environment: staging
spec:
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: octa-app

  template:
    metadata:
      labels:
        app: octa-app
        environment: staging

      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"

    spec:
      containers:
        - name: octa-app

          image: 507941514830.dkr.ecr.ap-south-1.amazonaws.com/octabyte/staging/app:latest

          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          envFrom:
            - configMapRef:
                name: octa-app-config

            - secretRef:
                name: octa-app-secret

          env:
            - name: REDIS_URL
              value: "redis://redis-service:6379/0"

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"

            limits:
              cpu: "1000m"
              memory: "1Gi"

          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

      terminationGracePeriodSeconds: 30

